<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tote Picking Form</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.header{
  background:#172554;
  color:white;
  padding:18px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header p{
  margin:6px 0 0;
  font-size:13px;
  opacity:.85;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:12px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

input[readonly]{
  background:#f1f5f9;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.warning{
  background:#f59e0b;
  color:white;
}

.danger{
  background:#dc2626;
  color:white;
}

.secondary{
  background:#64748b;
  color:white;
}

button:disabled{
  opacity:.55;
}

.status{
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
  display:none;
}

.status.success-msg{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error-msg{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.info-msg{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.hidden{
  display:none!important;
}

.tote-box{
  text-align:center;
  background:#eef2ff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

.tote-id{
  font-size:24px;
  font-weight:bold;
  color:#1e3a8a;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info{
  background:#f8fafc;
  padding:12px;
  border-radius:10px;
}

.info small{
  display:block;
  color:#64748b;
  margin-bottom:4px;
}

.info strong{
  font-size:16px;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>📦 TOTE PICKING FORM</h1>
  <p>Permanent Tote QR Management System</p>
</div>

<div class="container">

  <div id="statusBox" class="status"></div>

  <!-- QR / TOTE -->
  <div class="card">

    <div class="section-title">
      🔎 Tote Scan
    </div>

    <label>Tote ID</label>

    <input
      id="toteId"
      type="text"
      placeholder="Scan / Enter Tote ID"
      autocomplete="off"
    >

    <button
      class="primary"
      onclick="loadTote()">
      🔍 START / LOAD TOTE
    </button>

  </div>


  <!-- PICKING FORM -->
  <div id="pickingCard" class="card hidden">

    <div class="section-title">
      📝 Picking Details
    </div>

    <div class="tote-box">
      <div>TOTE</div>
      <div id="displayTote" class="tote-id">---</div>
    </div>

    <label>Vendor</label>

    <input
      id="vendor"
      type="text"
      placeholder="Vendor Name"
    >


    <label>Picker Name</label>

    <input
      id="pickerName"
      type="text"
      placeholder="Picker Name"
    >


    <label>TL</label>

    <input
      id="tlNo"
      type="text"
      placeholder="TL Name / Number"
    >


    <label>Total Quantity</label>

    <input
      id="totalQty"
      type="number"
      min="0"
      placeholder="Total Quantity"
    >


    <label>Reject Quantity</label>

    <input
      id="rejectQty"
      type="number"
      min="0"
      value="0"
      placeholder="Reject Quantity"
    >


    <button
      id="saveBtn"
      class="primary"
      onclick="saveData()">
      💾 SAVE PICKING
    </button>

    <button
      id="completeBtn"
      class="success"
      onclick="completePicking()">
      ✅ PICKING COMPLETE
    </button>

  </div>


  <!-- VRP -->
  <div id="vrpCard" class="card hidden">

    <div class="section-title">
      🔐 VRP Verification
    </div>

    <label>VRP</label>

    <input
      id="vrp"
      type="text"
      placeholder="Enter VRP"
    >

    <button
      class="warning"
      onclick="verifyVRP()">
      🔐 VERIFY VRP
    </button>

  </div>


  <!-- DETAILS -->
  <div id="detailsCard" class="card hidden">

    <div class="section-title">
      📋 Picking Details
    </div>

    <div class="grid">

      <div class="info">
        <small>Tote ID</small>
        <strong id="dTote">---</strong>
      </div>

      <div class="info">
        <small>Vendor</small>
        <strong id="dVendor">---</strong>
      </div>

      <div class="info">
        <small>Picker</small>
        <strong id="dPicker">---</strong>
      </div>

      <div class="info">
        <small>TL</small>
        <strong id="dTL">---</strong>
      </div>

      <div class="info">
        <small>Total Qty</small>
        <strong id="dTotal">---</strong>
      </div>

      <div class="info">
        <small>Reject Qty</small>
        <strong id="dReject">---</strong>
      </div>

      <div class="info">
        <small>Status</small>
        <strong id="dStatus">---</strong>
      </div>

      <div class="info">
        <small>VRP</small>
        <strong id="dVRP">---</strong>
      </div>

      <div class="info">
        <small>VRP Status</small>
        <strong id="dVRPStatus">---</strong>
      </div>

    </div>

    <button
      class="danger"
      onclick="resetTote()">
      ♻️ COMPLETE / RESET TOTE
    </button>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxrvoIPkhcN4jPWotX6DCDmLsI1v01G96tYMfZ_l_cYdhDCUxuk5sVMivjHlZUoRrOU/exec";


/* =====================================================
   ELEMENTS
   ===================================================== */

const toteIdEl =
document.getElementById("toteId");

const vendorEl =
document.getElementById("vendor");

const pickerNameEl =
document.getElementById("pickerName");

const tlNoEl =
document.getElementById("tlNo");

const totalQtyEl =
document.getElementById("totalQty");

const rejectQtyEl =
document.getElementById("rejectQty");

const vrpEl =
document.getElementById("vrp");

const pickingCard =
document.getElementById("pickingCard");

const vrpCard =
document.getElementById("vrpCard");

const detailsCard =
document.getElementById("detailsCard");

const statusBox =
document.getElementById("statusBox");


/* =====================================================
   STATUS MESSAGE
   ===================================================== */

function showStatus(message,type="info"){

  statusBox.className =
  "status " +
  (
    type === "success"
      ? "success-msg"
      : type === "error"
      ? "error-msg"
      : "info-msg"
  );

  statusBox.textContent = message;

}


/* =====================================================
   GOOGLE API REQUEST
   ===================================================== */

async function apiRequest(payload){

  try{

    const response =
    await fetch(API_URL,{
      method:"POST",

      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },

      body:JSON.stringify(payload)
    });


    if(!response.ok){

      throw new Error(
        "HTTP Error " + response.status
      );

    }


    const text =
    await response.text();


    let result;

    try{

      result =
      JSON.parse(text);

    }catch(error){

      throw new Error(
        "Google API ने JSON response नहीं दिया"
      );

    }


    return result;


  }catch(error){

    console.error(
      "API ERROR:",
      error
    );

    throw error;

  }

}


/* =====================================================
   LOAD TOTE
   ===================================================== */

async function loadTote(){

  const toteId =
  toteIdEl.value.trim();


  if(!toteId){

    showStatus(
      "Please scan or enter Tote ID",
      "error"
    );

    toteIdEl.focus();

    return;

  }


  showStatus(
    "🔄 Google Sheet से Tote data check हो रहा है...",
    "info"
  );


  try{

    const result =
    await apiRequest({

      action:"get",

      toteId:toteId

    });


    if(result.success){

      fillData(
        result.data
      );

      showStatus(
        "✅ Tote data loaded successfully",
        "success"
      );

      return;

    }


    /*
      नया tote होने पर भी form open होगा
    */

    clearForm();

    displayTote.textContent =
    toteId;

    pickingCard.classList.remove(
      "hidden"
    );

    showStatus(
      "🆕 नया Tote मिला — Picking Form भरें",
      "info"
    );


  }catch(error){

    /*
      IMPORTANT:
      API connection fail होने पर
      form बंद नहीं होगा
    */

    clearForm();

    displayTote.textContent =
    toteId;

    pickingCard.classList.remove(
      "hidden"
    );

    showStatus(
      "⚠️ Google connection response नहीं मिला। फिर भी form open है।",
      "error"
    );

  }

}


/* =====================================================
   FILL EXISTING DATA
   ===================================================== */

function fillData(data){

  toteIdEl.value =
  data.toteId || "";

  document.getElementById(
    "displayTote"
  ).textContent =
  data.toteId || "---";


  vendorEl.value =
  data.vendor || "";

  pickerNameEl.value =
  data.pickerName || "";

  tlNoEl.value =
  data.tlNo || "";

  totalQtyEl.value =
  data.totalQty || "";

  rejectQtyEl.value =
  data.rejectQty || "0";

  vrpEl.value =
  data.vrp || "";


  pickingCard.classList.remove(
    "hidden"
  );


  if(
    data.status === "Picking Complete" ||
    data.status === "VRP Verified"
  ){

    vrpCard.classList.remove(
      "hidden"
    );

  }


  showDetails(data);

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm(){

  vendorEl.value = "";
  pickerNameEl.value = "";
  tlNoEl.value = "";
  totalQtyEl.value = "";
  rejectQtyEl.value = "0";
  vrpEl.value = "";

  vrpCard.classList.add(
    "hidden"
  );

  detailsCard.classList.add(
    "hidden"
  );

}


/* =====================================================
   SAVE PICKING
   ===================================================== */

async function saveData(){

  const toteId =
  toteIdEl.value.trim();


  if(!toteId){

    showStatus(
      "Tote ID required",
      "error"
    );

    return;

  }


  if(!pickerNameEl.value.trim()){

    showStatus(
      "Picker Name required",
      "error"
    );

    pickerNameEl.focus();

    return;

  }


  if(!totalQtyEl.value){

    showStatus(
      "Total Quantity required",
      "error"
    );

    totalQtyEl.focus();

    return;

  }


  showStatus(
    "💾 Data Google Sheet में save हो रहा है...",
    "info"
  );


  try{

    const result =
    await apiRequest({

      action:"save",

      toteId:toteId,

      vendor:vendorEl.value.trim(),

      pickerName:
      pickerNameEl.value.trim(),

      tlNo:
      tlNoEl.value.trim(),

      totalQty:
      totalQtyEl.value.trim(),

      rejectQty:
      rejectQtyEl.value.trim() || "0",

      status:"Saved"

    });


    if(!result.success){

      throw new Error(
        result.message
      );

    }


    showStatus(
      "✅ Picking data Google Sheet में save हो गया",
      "success"
    );


    await loadTote();


  }catch(error){

    showStatus(
      "❌ Save failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   PICKING COMPLETE
   ===================================================== */

async function completePicking(){

  const toteId =
  toteIdEl.value.trim();


  if(!toteId){

    showStatus(
      "Tote ID required",
      "error"
    );

    return;

  }


  showStatus(
    "⏳ Picking complete हो रही है...",
    "info"
  );


  try{

    /*
      पहले save
    */

    const saveResult =
    await apiRequest({

      action:"save",

      toteId:toteId,

      vendor:vendorEl.value.trim(),

      pickerName:
      pickerNameEl.value.trim(),

      tlNo:
      tlNoEl.value.trim(),

      totalQty:
      totalQtyEl.value.trim(),

      rejectQty:
      rejectQtyEl.value.trim() || "0",

      status:"Saved"

    });


    if(!saveResult.success){

      throw new Error(
        saveResult.message
      );

    }


    /*
      फिर picking complete
    */

    const result =
    await apiRequest({

      action:"pickingComplete",

      toteId:toteId

    });


    if(!result.success){

      throw new Error(
        result.message
      );

    }


    showStatus(
      "✅ PICKING COMPLETE",
      "success"
    );


    vrpCard.classList.remove(
      "hidden"
    );


    await loadTote();


  }catch(error){

    showStatus(
      "❌ Picking complete failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   VRP VERIFY
   ===================================================== */

async function verifyVRP(){

  const toteId =
  toteIdEl.value.trim();

  const vrp =
  vrpEl.value.trim();


  if(!vrp){

    showStatus(
      "VRP required",
      "error"
    );

    vrpEl.focus();

    return;

  }


  showStatus(
    "🔐 VRP verify हो रहा है...",
    "info"
  );


  try{

    const result =
    await apiRequest({

      action:"vrpVerify",

      toteId:toteId,

      vrp:vrp

    });


    if(!result.success){

      throw new Error(
        result.message
      );

    }


    showStatus(
      "✅ VRP VERIFIED",
      "success"
    );


    await loadTote();


  }catch(error){

    showStatus(
      "❌ VRP verification failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   SHOW DETAILS
   ===================================================== */

function showDetails(data){

  if(!data){
    return;
  }


  document.getElementById(
    "dTote"
  ).textContent =
  data.toteId || "---";


  document.getElementById(
    "dVendor"
  ).textContent =
  data.vendor || "---";


  document.getElementById(
    "dPicker"
  ).textContent =
  data.pickerName || "---";


  document.getElementById(
    "dTL"
  ).textContent =
  data.tlNo || "---";


  document.getElementById(
    "dTotal"
  ).textContent =
  data.totalQty || "---";


  document.getElementById(
    "dReject"
  ).textContent =
  data.rejectQty || "0";


  document.getElementById(
    "dStatus"
  ).textContent =
  data.status || "---";


  document.getElementById(
    "dVRP"
  ).textContent =
  data.vrp || "---";


  document.getElementById(
    "dVRPStatus"
  ).textContent =
  data.vrpStatus || "---";


  detailsCard.classList.remove(
    "hidden"
  );

}


/* =====================================================
   RESET TOTE
   ===================================================== */

async function resetTote(){

  const toteId =
  toteIdEl.value.trim();


  if(!toteId){

    showStatus(
      "Tote ID required",
      "error"
    );

    return;

  }


  const confirmReset =
  confirm(
    "क्या आप इस Tote को Complete/Reset करना चाहते हैं?"
  );


  if(!confirmReset){
    return;
  }


  showStatus(
    "♻️ Tote reset हो रहा है...",
    "info"
  );


  try{

    const result =
    await apiRequest({

      action:"reset",

      toteId:toteId

    });


    if(!result.success){

      throw new Error(
        result.message
      );

    }


    showStatus(
      "✅ Tote reset हो गया और History में save हो गया",
      "success"
    );


    toteIdEl.value = "";

    clearForm();

    pickingCard.classList.add(
      "hidden"
    );

    vrpCard.classList.add(
      "hidden"
    );

    detailsCard.classList.add(
      "hidden"
    );


  }catch(error){

    showStatus(
      "❌ Reset failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   ENTER KEY
   ===================================================== */

toteIdEl.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      loadTote();

    }

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

console.log(
  "Tote Picking Form loaded"
);

console.log(
  "API:",
  API_URL
);

</script>

</body>
</html>
