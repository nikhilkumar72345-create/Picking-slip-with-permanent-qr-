<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tote Picking Slip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .8;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .warning {
      background: #f59e0b;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #374151;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 10px;
      font-size: 14px;
      display: none;
    }

    .status.successMsg {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.errorMsg {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.loadingMsg {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .details {
      display: none;
    }

    .details.show {
      display: block;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: bold;
      color: #555;
    }

    .detail-value {
      text-align: right;
      word-break: break-word;
    }

    .actions {
      display: none;
    }

    .actions.show {
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #e5e7eb;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 15px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📦 TOTE PICKING SLIP</h1>
    <p>Permanent Tote QR Management System</p>
  </div>

  <div id="statusBox" class="status"></div>

  <!-- TOTE SEARCH -->
  <div class="card">
    <label for="toteId">Tote ID</label>

    <input
      type="text"
      id="toteId"
      placeholder="Scan / Enter Tote ID"
      autocomplete="off"
    >

    <button
      id="loadBtn"
      class="primary"
      onclick="loadTote()">
      🔍 Load Tote
    </button>
  </div>

  <!-- PICKING FORM -->
  <div class="card">

    <h3>📝 Picking Details</h3>

    <label>Vendor</label>
    <input
      type="text"
      id="vendor"
      placeholder="Enter Vendor"
    >

    <label>Picker Name</label>
    <input
      type="text"
      id="pickerName"
      placeholder="Enter Picker Name"
    >

    <label>TL</label>
    <input
      type="text"
      id="tlNo"
      placeholder="Enter TL"
    >

    <label>Total Quantity</label>
    <input
      type="number"
      id="totalQty"
      placeholder="Enter Total Qty"
      min="0"
    >

    <label>Reject Quantity</label>
    <input
      type="number"
      id="rejectQty"
      placeholder="Enter Reject Qty"
      min="0"
      value="0"
    >

    <button
      id="saveBtn"
      class="primary"
      onclick="saveData()">
      💾 Save Picking Data
    </button>

  </div>

  <!-- CURRENT DETAILS -->
  <div id="detailsCard" class="card details">

    <h3>📋 Picking Details View</h3>

    <div class="detail-row">
      <span class="detail-label">Tote ID</span>
      <span id="dToteId" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Vendor</span>
      <span id="dVendor" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Picker</span>
      <span id="dPicker" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">TL</span>
      <span id="dTL" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Total Qty</span>
      <span id="dQty" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Reject Qty</span>
      <span id="dReject" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Status</span>
      <span id="dStatus" class="detail-value">
        <span class="badge">-</span>
      </span>
    </div>

    <div class="detail-row">
      <span class="detail-label">VRP</span>
      <span id="dVRP" class="detail-value">-</span>
    </div>

    <div class="detail-row">
      <span class="detail-label">VRP Status</span>
      <span id="dVRPStatus" class="detail-value">-</span>
    </div>

  </div>

  <!-- ACTIONS -->
  <div id="actionsCard" class="card actions">

    <button
      id="completeBtn"
      class="success"
      onclick="completePicking()">
      ✅ Picking Complete
    </button>

    <label>VRP Entry</label>

    <input
      type="text"
      id="vrp"
      placeholder="Enter VRP"
      autocomplete="off"
    >

    <button
      id="verifyBtn"
      class="warning"
      onclick="verifyVRP()">
      🔐 Verify VRP
    </button>

    <button
      id="viewBtn"
      class="secondary"
      onclick="viewTote()">
      👁️ View Picking Details
    </button>

    <button
      id="resetBtn"
      class="danger"
      onclick="resetTote()">
      ♻️ Complete / Reset Tote
    </button>

  </div>

  <div class="footer">
    Permanent Tote QR • Mobile / HHD Friendly
  </div>

</div>

<script>

  /* =====================================================
     GOOGLE APPS SCRIPT API
     ===================================================== */

  const API_URL =
    "https://script.google.com/a/macros/flipkart.com/s/AKfycbzYtjj7uFzinKq8WRSuzcsty2oUTUDKplRIhOld5C-2ikiOgb29oi-hkhgwlVI9pZDtK/exec";


  /* =====================================================
     CLIENT CACHE
     ===================================================== */

  const clientCache = new Map();


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const toteInput = document.getElementById("toteId");

  const vendorInput = document.getElementById("vendor");
  const pickerInput = document.getElementById("pickerName");
  const tlInput = document.getElementById("tlNo");
  const qtyInput = document.getElementById("totalQty");
  const rejectInput = document.getElementById("rejectQty");
  const vrpInput = document.getElementById("vrp");

  const detailsCard =
    document.getElementById("detailsCard");

  const actionsCard =
    document.getElementById("actionsCard");

  const statusBox =
    document.getElementById("statusBox");


  /* =====================================================
     STATUS
     ===================================================== */

  function showStatus(message, type = "loadingMsg") {

    statusBox.textContent = message;

    statusBox.className =
      "status " + type;
  }


  function hideStatus() {

    statusBox.textContent = "";

    statusBox.className = "status";
  }


  /* =====================================================
     BUTTON LOCK
     ===================================================== */

  function lockButton(button, text) {

    button.disabled = true;
    button.dataset.oldText = button.textContent;
    button.textContent = text;
  }


  function unlockButton(button) {

    button.disabled = false;

    if (button.dataset.oldText) {
      button.textContent = button.dataset.oldText;
    }
  }


  /* =====================================================
     API REQUEST
     ===================================================== */

  async function apiRequest(payload) {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(() => controller.abort(), 12000);

    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify(payload),

          cache: "no-store",

          signal: controller.signal
        });


      if (!response.ok) {

        throw new Error(
          "Server error: " + response.status
        );
      }


      const result =
        await response.json();

      return result;

    } catch (error) {

      if (error.name === "AbortError") {

        throw new Error(
          "Server response timeout."
        );
      }

      throw error;

    } finally {

      clearTimeout(timeout);
    }
  }


  /* =====================================================
     LOAD TOTE
     ===================================================== */

  async function loadTote() {

    const toteId =
      toteInput.value.trim();

    if (!toteId) {

      showStatus(
        "Please enter or scan Tote ID.",
        "errorMsg"
      );

      toteInput.focus();

      return;
    }


    const button =
      document.getElementById("loadBtn");

    lockButton(
      button,
      "⏳ Loading..."
    );

    showStatus(
      "Tote data load ho raha hai...",
      "loadingMsg"
    );


    try {

      if (clientCache.has(toteId)) {

        const cached =
          clientCache.get(toteId);

        fillData(cached);

        showStatus(
          "⚡ Data loaded from cache.",
          "successMsg"
        );

        return;
      }


      const result =
        await apiRequest({

          action: "get",

          toteId: toteId
        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "Tote data not found."
        );
      }


      const data =
        result.data;


      clientCache.set(
        toteId,
        data
      );


      fillData(data);


      showStatus(
        "✅ Tote data loaded successfully.",
        "successMsg"
      );


    } catch (error) {

      showStatus(
        "❌ " + error.message,
        "errorMsg"
      );

    } finally {

      unlockButton(button);
    }
  }


  /* =====================================================
     FILL DATA
     ===================================================== */

  function fillData(data) {

    vendorInput.value =
      data.vendor || "";

    pickerInput.value =
      data.pickerName || "";

    tlInput.value =
      data.tlNo || "";

    qtyInput.value =
      data.totalQty || "";

    rejectInput.value =
      data.rejectQty || "0";

    vrpInput.value =
      data.vrp || "";


    updateDetails(data);


    detailsCard.classList.add("show");

    actionsCard.classList.add("show");
  }


  /* =====================================================
     UPDATE DETAILS
     ===================================================== */

  function updateDetails(data) {

    document.getElementById(
      "dToteId"
    ).textContent =
      data.toteId || "-";

    document.getElementById(
      "dVendor"
    ).textContent =
      data.vendor || "-";

    document.getElementById(
      "dPicker"
    ).textContent =
      data.pickerName || "-";

    document.getElementById(
      "dTL"
    ).textContent =
      data.tlNo || "-";

    document.getElementById(
      "dQty"
    ).textContent =
      data.totalQty || "-";

    document.getElementById(
      "dReject"
    ).textContent =
      data.rejectQty || "0";

    document.getElementById(
      "dStatus"
    ).innerHTML =
      '<span class="badge">' +
      escapeHTML(data.status || "-") +
      "</span>";

    document.getElementById(
      "dVRP"
    ).textContent =
      data.vrp || "-";

    document.getElementById(
      "dVRPStatus"
    ).textContent =
      data.vrpStatus || "-";
  }


  /* =====================================================
     SAVE DATA
     ===================================================== */

  async function saveData() {

    const toteId =
      toteInput.value.trim();

    if (!toteId) {

      showStatus(
        "Tote ID required.",
        "errorMsg"
      );

      return;
    }


    const vendor =
      vendorInput.value.trim();

    const pickerName =
      pickerInput.value.trim();

    const tlNo =
      tlInput.value.trim();

    const totalQty =
      qtyInput.value.trim();

    const rejectQty =
      rejectInput.value.trim() || "0";


    if (!vendor ||
        !pickerName ||
        !tlNo ||
        !totalQty) {

      showStatus(
        "Please fill all required picking details.",
        "errorMsg"
      );

      return;
    }


    if (
      Number(rejectQty) >
      Number(totalQty)
    ) {

      showStatus(
        "Reject Qty cannot be greater than Total Qty.",
        "errorMsg"
      );

      return;
    }


    const button =
      document.getElementById("saveBtn");

    lockButton(
      button,
      "⏳ Saving..."
    );

    showStatus(
      "Picking data save ho raha hai...",
      "loadingMsg"
    );


    try {

      const result =
        await apiRequest({

          action: "save",

          toteId: toteId,

          vendor: vendor,

          pickerName: pickerName,

          tlNo: tlNo,

          totalQty: totalQty,

          rejectQty: rejectQty,

          status: "Saved",

          vrp: vrpInput.value.trim(),

          vrpStatus: "",

          vrpTimestamp: ""
        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "Save failed."
        );
      }


      const data = {

        toteId: toteId,

        vendor: vendor,

        pickerName: pickerName,

        tlNo: tlNo,

        totalQty: totalQty,

        rejectQty: rejectQty,

        status: "Saved",

        vrp: vrpInput.value.trim(),

        vrpStatus: "",

        vrpTimestamp: ""
      };


      clientCache.set(
        toteId,
        data
      );


      updateDetails(data);

      detailsCard.classList.add("show");

      actionsCard.classList.add("show");


      showStatus(
        "✅ Picking data saved successfully.",
        "successMsg"
      );


    } catch (error) {

      showStatus(
        "❌ " + error.message,
        "errorMsg"
      );

    } finally {

      unlockButton(button);
    }
  }


  /* =====================================================
     PICKING COMPLETE
     ===================================================== */

  async function completePicking() {

    const toteId =
      toteInput.value.trim();

    if (!toteId) {

      showStatus(
        "Tote ID required.",
        "errorMsg"
      );

      return;
    }


    const button =
      document.getElementById("completeBtn");

    lockButton(
      button,
      "⏳ Completing..."
    );

    showStatus(
      "Picking complete ho raha hai...",
      "loadingMsg"
    );


    try {

      const result =
        await apiRequest({

          action: "pickingComplete",

          toteId: toteId
        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "Unable to complete picking."
        );
      }


      const cached =
        clientCache.get(toteId) || {

          toteId: toteId,

          vendor: vendorInput.value,

          pickerName: pickerInput.value,

          tlNo: tlInput.value,

          totalQty: qtyInput.value,

          rejectQty: rejectInput.value || "0",

          vrp: vrpInput.value || "",

          vrpStatus: ""
        };


      cached.status =
        "Picking Complete";


      clientCache.set(
        toteId,
        cached
      );


      updateDetails(cached);


      showStatus(
        "✅ Picking completed successfully.",
        "successMsg"
      );


    } catch (error) {

      showStatus(
        "❌ " + error.message,
        "errorMsg"
      );

    } finally {

      unlockButton(button);
    }
  }


  /* =====================================================
     VRP VERIFY
     ===================================================== */

  async function verifyVRP() {

    const toteId =
      toteInput.value.trim();

    const vrp =
      vrpInput.value.trim();


    if (!toteId) {

      showStatus(
        "Tote ID required.",
        "errorMsg"
      );

      return;
    }


    if (!vrp) {

      showStatus(
        "VRP required.",
        "errorMsg"
      );

      vrpInput.focus();

      return;
    }


    const button =
      document.getElementById("verifyBtn");

    lockButton(
      button,
      "⏳ Verifying..."
    );

    showStatus(
      "VRP verify ho raha hai...",
      "loadingMsg"
    );


    try {

      const result =
        await apiRequest({

          action: "vrpVerify",

          toteId: toteId,

          vrp: vrp
        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "VRP verification failed."
        );
      }


      const data =
        result.data || {

          ...(clientCache.get(toteId) || {}),

          toteId: toteId,

          vrp: vrp,

          vrpStatus: "Verified",

          status: "VRP Verified"
        };


      data.vrp =
        vrp;

      data.vrpStatus =
        "Verified";

      data.status =
        "VRP Verified";


      clientCache.set(
        toteId,
        data
      );


      updateDetails(data);


      showStatus(
        "✅ VRP verified successfully.",
        "successMsg"
      );


    } catch (error) {

      showStatus(
        "❌ " + error.message,
        "errorMsg"
      );

    } finally {

      unlockButton(button);
    }
  }


  /* =====================================================
     VIEW TOTE
     ===================================================== */

  async function viewTote() {

    const toteId =
      toteInput.value.trim();

    if (!toteId) {

      showStatus(
        "Tote ID required.",
        "errorMsg"
      );

      return;
    }


    showStatus(
      "Latest tote details load ho rahe hain...",
      "loadingMsg"
    );


    try {

      const result =
        await apiRequest({

          action: "get",

          toteId: toteId
        });


      if (!result.success) {

        throw new Error(
          result.message ||
          "Tote not found."
        );
      }


      clientCache.set(
        toteId,
        result.data
      );


      fillData(
        result.data
      );


      showStatus(
        "✅ Latest details loaded.",
        "successMsg"
      );


    } catch (error) {

      showStatus(
        "❌ " + error.message,
        "errorMsg"
      );
    }
  }


  /* =====================================================
     RESET TOTE
     ===================================================== */

  async function resetTote() {
