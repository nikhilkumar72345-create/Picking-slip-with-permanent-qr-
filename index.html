<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Tote Picking Management</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #eef2f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    }

    .app {
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    /* ================= HEADER ================= */

    .header {
      background: linear-gradient(135deg, #123b67, #1769aa);
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 22px 22px;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    .live {
      background: rgba(255,255,255,.16);
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      opacity: .85;
    }

    /* ================= CONTENT ================= */

    .content {
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #26384d;
    }

    /* ================= TOTE ID ================= */

    .tote-box {
      border: 2px solid #1769aa;
      background: #f5faff;
    }

    .tote-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .tote-label span:first-child {
      font-weight: 800;
      color: #1769aa;
    }

    .required {
      color: #d32f2f;
      font-size: 12px;
    }

    #toteId {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 24px;
      font-weight: 800;
      color: #172033;
      padding: 7px 0;
    }

    #toteId::placeholder {
      color: #9aa5b1;
      font-size: 17px;
    }

    /* ================= FORM ================= */

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #526171;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #d2d9e1;
      border-radius: 10px;
      background: #fafbfd;
      font-size: 16px;
      color: #172033;
      outline: none;
    }

    input:focus {
      border-color: #1769aa;
      background: white;
      box-shadow: 0 0 0 3px rgba(23,105,170,.10);
    }

    /* ================= BUTTONS ================= */

    button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .15s;
    }

    button:active {
      transform: scale(.97);
    }

    .primary {
      background: #16803c;
    }

    .blue {
      background: #1976d2;
    }

    .orange {
      background: #ef7d00;
    }

    .red {
      background: #d32f2f;
    }

    .purple {
      background: #7b1fa2;
    }

    .cyan {
      background: #008c95;
    }

    .dark {
      background: #344454;
    }

    /* ================= ACTION GRID ================= */

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ================= MAIN SAVE ================= */

    .save-button {
      margin-top: 14px;
      min-height: 54px;
      font-size: 17px;
    }

    /* ================= WORKFLOW ================= */

    .workflow {
      display: grid;
      gap: 10px;
    }

    .workflow button {
      min-height: 54px;
    }

    /* ================= VRP ================= */

    .vrp-card {
      border-left: 5px solid #008c95;
    }

    /* ================= STATUS ================= */

    .status-box {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .info {
      background: #e3f2fd;
      color: #1565c0;
    }

    /* ================= FOOTER ================= */

    .footer {
      text-align: center;
      color: #8a96a3;
      font-size: 11px;
      padding: 8px;
    }

    @media (max-width: 480px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .action-grid {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ================= HEADER ================= -->

  <div class="header">

    <div class="header-top">

      <div class="brand">
        📦 TOTE PICKING
      </div>

      <div class="live">
        ● ONLINE
      </div>

    </div>

    <div class="subtitle">
      Permanent QR • Picking Management System
    </div>

  </div>


  <div class="content">


    <!-- ================= STATUS ================= -->

    <div
      id="statusBox"
      class="status-box">
    </div>


    <!-- ================= TOTE ================= -->

    <div class="card tote-box">

      <div class="tote-label">

        <span>
          TOTE ID
        </span>

        <span class="required">
          REQUIRED *
        </span>

      </div>

      <input
        id="toteId"
        type="text"
        placeholder="Enter Tote ID  •  428-00506"
        autocomplete="off">

    </div>


    <!-- ================= PICKING DETAILS ================= -->

    <div class="card">

      <div class="section-title">
        👤 PICKING DETAILS
      </div>


      <div class="form-grid">


        <div class="field">

          <label>
            Vendor *
          </label>

          <input
            id="vendor"
            type="text"
            placeholder="Vendor"
            autocomplete="off">

        </div>


        <div class="field">

          <label>
            Picker Name *
          </label>

          <input
            id="pickerName"
            type="text"
            placeholder="Picker"
            autocomplete="off">

        </div>


        <div class="field">

          <label>
            TL *
          </label>

          <input
            id="tlNo"
            type="text"
            placeholder="TL"
            autocomplete="off">

        </div>


        <div class="field">

          <label>
            Total Qty *
          </label>

          <input
            id="totalQty"
            type="number"
            min="0"
            placeholder="0">

        </div>


        <div class="field full">

          <label>
            Reject Qty
          </label>

          <input
            id="rejectQty"
            type="number"
            min="0"
            value="0"
            placeholder="0">

        </div>


      </div>


      <!-- SAVE -->

      <button
        class="primary save-button"
        onclick="saveData()">

        💾 SAVE DATA

      </button>

    </div>


    <!-- ================= MANAGE ================= -->

    <div class="card">

      <div class="section-title">
        ⚙️ MANAGE TOTE
      </div>


      <div class="action-grid">


        <button
          class="blue"
          onclick="viewData()">

          👁 VIEW DATA

        </button>


        <button
          class="orange"
          onclick="editData()">

          ✏️ EDIT DATA

        </button>


        <button
          class="purple"
          onclick="viewHistory()">

          📜 HISTORY

        </button>


        <button
          class="red"
          onclick="resetTote()">

          🔄 RESET TOTE

        </button>


      </div>

    </div>


    <!-- ================= PICKING WORKFLOW ================= -->

    <div class="card">

      <div class="section-title">
        🚚 PICKING WORKFLOW
      </div>


      <div class="workflow">

        <button
          class="primary"
          onclick="pickingComplete()">

          ✅ PICKING COMPLETE

        </button>

      </div>

    </div>


    <!-- ================= VRP ================= -->

    <div class="card vrp-card">

      <div class="section-title">
        🔵 VRP VERIFICATION
      </div>


      <label>
        VRP Number
      </label>

      <input
        id="vrp"
        type="text"
        placeholder="Enter VRP number"
        autocomplete="off">


      <button
        class="cyan"
        style="margin-top:10px;"
        onclick="vrpVerify()">

        🔵 VERIFY VRP

      </button>

    </div>


    <div class="footer">

      Permanent QR • Tote Picking Management

    </div>


  </div>

</div>



<script>


// =====================================================
// GOOGLE APPS SCRIPT URL
// =====================================================

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxrvoIPkhcN4jPWotX6DCDmLsI1v01G96tYMfZ_l_cYdhDCUxuk5sVMivjHlZUoRrOU/exec";


// =====================================================
// STATUS
// =====================================================

function showStatus(message, type="info") {

  const box =
    document.getElementById("statusBox");

  box.style.display = "block";

  box.className =
    "status-box " + type;

  box.innerText = message;

}


// =====================================================
// FORM DATA
// =====================================================

function getData() {

  return {

    toteId:
      document.getElementById("toteId")
      .value.trim(),

    vendor:
      document.getElementById("vendor")
      .value.trim(),

    pickerName:
      document.getElementById("pickerName")
      .value.trim(),

    tlNo:
      document.getElementById("tlNo")
      .value.trim(),

    totalQty:
      document.getElementById("totalQty")
      .value.trim(),

    rejectQty:
      document.getElementById("rejectQty")
      .value.trim() || "0",

    vrp:
      document.getElementById("vrp")
      .value.trim()

  };

}


// =====================================================
// VALIDATION
// =====================================================

function validateData() {

  const data = getData();


  if (!data.toteId) {

    alert("⚠️ Tote ID required");

    document.getElementById("toteId").focus();

    return false;
  }


  if (!data.vendor) {

    alert("⚠️ Vendor required");

    document.getElementById("vendor").focus();

    return false;
  }


  if (!data.pickerName) {

    alert("⚠️ Picker Name required");

    document.getElementById("pickerName").focus();

    return false;
  }


  if (!data.tlNo) {

    alert("⚠️ TL required");

    document.getElementById("tlNo").focus();

    return false;
  }


  if (!data.totalQty) {

    alert("⚠️ Total Qty required");

    document.getElementById("totalQty").focus();

    return false;
  }


  return true;

}


// =====================================================
// VIEW DATA
// =====================================================

async function viewData() {

  const toteId =
    document.getElementById("toteId")
    .value.trim();


  if (!toteId) {

    alert("⚠️ पहले Tote ID डालें");

    return;
  }


  showStatus(
    "🔄 Current data loading...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "get",

          toteId: toteId

        })

      });


    const result =
      await response.json();


    if (!result.success) {

      showStatus(
        "ℹ️ इस Tote का current data नहीं मिला।",
        "error"
      );

      return;
    }


    const d =
      result.data;


    document.getElementById("toteId").value =
      d.toteId || "";

    document.getElementById("vendor").value =
      d.vendor || "";

    document.getElementById("pickerName").value =
      d.pickerName || "";

    document.getElementById("tlNo").value =
      d.tlNo || "";

    document.getElementById("totalQty").value =
      d.totalQty || "";

    document.getElementById("rejectQty").value =
      d.rejectQty || "0";

    document.getElementById("vrp").value =
      d.vrp || "";


    showStatus(
      "✅ Current data loaded",
      "success"
    );


  } catch(error) {

    showStatus(
      "❌ Google Sheet connection failed",
      "error"
    );

    console.error(error);

  }

}


// =====================================================
// EDIT
// =====================================================

function editData() {

  document
    .getElementById("toteId")
    .focus();


  showStatus(
    "✏️ Form editing के लिए ready है",
    "info"
  );

}


// =====================================================
// SAVE
// =====================================================

async function saveData() {

  if (!validateData()) {

    return;
  }


  const data =
    getData();


  showStatus(
    "💾 Saving data...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "save",

          toteId: data.toteId,

          vendor: data.vendor,

          pickerName: data.pickerName,

          tlNo: data.tlNo,

          totalQty: data.totalQty,

          rejectQty: data.rejectQty,

          vrp: data.vrp,

          status: "Saved"

        })

      });


    const result =
      await response.json();


    if (result.success) {

      showStatus(
        "✅ Data saved successfully",
        "success"
      );

    } else {

      showStatus(
        "❌ " + result.message,
        "error"
      );

    }


  } catch(error) {

    showStatus(
      "❌ Google Sheet connection failed",
      "error"
    );

    console.error(error);

  }

}


// =====================================================
// PICKING COMPLETE
// =====================================================

async function pickingComplete() {

  if (!validateData()) {

    return;
  }


  if (
    !confirm(
      "क्या Picking Complete करना है?"
    )
  ) {

    return;
  }


  const data =
    getData();


  showStatus(
    "⏳ Completing picking...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "pickingComplete",

          toteId: data.toteId

        })

      });


    const result =
      await response.json();


    if (result.success) {

      showStatus(
        "✅ PICKING COMPLETE",
        "success"
      );

      alert(
        "✅ Picking Complete हो गया.\n\nअब VRP Verify करें."
      );


    } else {

      showStatus(
        "❌ " + result.message,
        "error"
      );

    }


  } catch(error) {

    showStatus(
      "❌ Connection failed",
      "error"
    );

  }

}


// =====================================================
// VRP VERIFY
// =====================================================

async function vrpVerify() {

  const data =
    getData();


  if (!data.toteId) {

    alert(
      "⚠️ Tote ID required"
    );

    return;
  }


  if (!data.vrp) {

    alert(
      "⚠️ VRP number enter करें"
    );

    document
      .getElementById("vrp")
      .focus();

    return;
  }


  if (
    !confirm(
      "क्या VRP verify करना है?"
    )
  ) {

    return;
  }


  showStatus(
    "🔵 Verifying VRP...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "vrpVerify",

          toteId: data.toteId,

          vrp: data.vrp

        })

      });


    const result =
      await response.json();


    if (result.success) {

      showStatus(
        "✅ VRP VERIFIED",
        "success"
      );

      alert(
        "✅ VRP successfully verified."
      );


    } else {

      showStatus(
        "❌ " + result.message,
        "error"
      );

    }


  } catch(error) {

    showStatus(
      "❌ Connection failed",
      "error"
    );

  }

}


// =====================================================
// RESET TOTE
// =====================================================

async function resetTote() {

  const data =
    getData();


  if (!data.toteId) {

    alert(
      "⚠️ Tote ID required"
    );

    return;
  }


  if (
    !confirm(
      "⚠️ RESET TOTE?\n\n" +
      "Current data History में permanently save होगा और current data clear हो जाएगा."
    )
  ) {

    return;
  }


  showStatus(
    "🔄 Resetting Tote...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "reset",

          toteId: data.toteId

        })

      });


    const result =
      await response.json();


    if (result.success) {

      clearForm();


      showStatus(
        "✅ Tote Reset Successfully",
        "success"
      );


      alert(
        "✅ Tote reset हो गया.\n\n" +
        "पुराना data History में सुरक्षित है."
      );


    } else {

      showStatus(
        "❌ " + result.message,
        "error"
      );

    }


  } catch(error) {

    showStatus(
      "❌ Connection failed",
      "error"
    );

  }

}


// =====================================================
// HISTORY
// =====================================================

async function viewHistory() {

  const toteId =
    document.getElementById("toteId")
    .value.trim();


  if (!toteId) {

    alert(
      "⚠️ Tote ID required"
    );

    return;
  }


  showStatus(
    "📜 Loading history...",
    "info"
  );


  try {

    const response =
      await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "history",

          toteId: toteId

        })

      });


    const result =
      await response.json();


    if (
      !result.success ||
      !result.data.history.length
    ) {

      alert(
        "📜 इस Tote की कोई History नहीं मिली."
      );

      return;
    }


    let text =
      "📜 TOTE HISTORY\n\n";


    result.data.history.forEach(
      function(item, index) {

        text +=
          "━━━━━━━━━━━━━━\n";

        text +=
          "Cycle: " +
          (index + 1) +
          "\n";

        text +=
          "Tote: " +
          item.toteId +
          "\n";

        text +=
          "Vendor: " +
          item.vendor +
          "\n";

        text +=
          "Picker: " +
          item.pickerName +
          "\n";

        text +=
          "TL: " +
          item.tlNo +
          "\n";

        text +=
          "Total Qty: " +
          item.totalQty +
          "\n";

        text +=
          "Reject Qty: " +
          item.rejectQty +
          "\n";

        text +=
          "Status: " +
          item.status +
          "\n";

        text +=
          "VRP: " +
          item.vrp +
          "\n";

        text +=
          "Action: " +
          item.action +
          "\n";

      }
    );


    alert(text);


    showStatus(
      "✅ History loaded",
      "success"
    );


  } catch(error) {

    showStatus(
      "❌ History connection failed",
      "error"
    );

  }

}


// =====================================================
// CLEAR FORM
// =====================================================

function clearForm() {

  document.getElementById("toteId").value = "";

  document.getElementById("vendor").value = "";

  document.getElementById("pickerName").value = "";

  document.getElementById("tlNo").value = "";

  document.getElementById("totalQty").value = "";

  document.getElementById("rejectQty").value = "0";

  document.getElementById("vrp").value = "";

}

</script>


</body>

</html>
