<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tote Picking Form</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f2f4f7;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1d3557;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 4px rgba(25,118,210,0.3);
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: none;
      padding: 13px 8px;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .blue {
      background: #1976d2;
    }

    .orange {
      background: #f57c00;
    }

    .green {
      background: #2e7d32;
    }

    .red {
      background: #d32f2f;
    }

    .purple {
      background: #7b1fa2;
    }

    .cyan {
      background: #008c95;
    }

    .status-box {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .complete-box {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }

    .full-button {
      width: 100%;
      margin-top: 10px;
    }

    @media (max-width: 450px) {
      .button-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📦 TOTE PICKING FORM</h1>

    <div class="subtitle">
      Permanent QR System
    </div>

    <!-- FORM -->

    <label for="toteId">Tote ID *</label>
    <input
      type="text"
      id="toteId"
      placeholder="Example: 428-00506"
      autocomplete="off"
    >

    <label for="vendor">Vendor *</label>
    <input
      type="text"
      id="vendor"
      placeholder="Enter Vendor"
      autocomplete="off"
    >

    <label for="pickerName">Picker Name *</label>
    <input
      type="text"
      id="pickerName"
      placeholder="Enter Picker Name"
      autocomplete="off"
    >

    <label for="tlNo">TL *</label>
    <input
      type="text"
      id="tlNo"
      placeholder="Enter TL"
      autocomplete="off"
    >

    <label for="totalQty">Total Qty *</label>
    <input
      type="number"
      id="totalQty"
      placeholder="Enter Total Quantity"
      min="0"
    >

    <label for="rejectQty">Reject Qty</label>
    <input
      type="number"
      id="rejectQty"
      placeholder="Enter Reject Quantity"
      min="0"
      value="0"
    >

    <!-- MANAGE TOTE -->

    <div class="button-grid">

      <button
        class="blue"
        onclick="viewData()">
        👁 View Data
      </button>

      <button
        class="orange"
        onclick="editData()">
        ✏️ Edit Data
      </button>

      <button
        class="green"
        onclick="saveData()">
        💾 Save Data
      </button>

      <button
        class="red"
        onclick="resetTote()">
        🔄 Reset Tote
      </button>

      <button
        class="purple"
        onclick="viewHistory()">
        📜 View History
      </button>

    </div>

    <!-- STATUS -->

    <div
      id="statusBox"
      class="status-box">
    </div>

    <!-- PICKING COMPLETE -->

    <div class="complete-box">

      <button
        class="green full-button"
        onclick="pickingComplete()">
        ✅ PICKING COMPLETE
      </button>

      <button
        class="cyan full-button"
        onclick="vrpVerify()">
        🔵 VRP VERIFY
      </button>

    </div>

  </div>


<script>

  /*
   * IMPORTANT
   * ------------------------------------------------
   * Yahan apna Google Apps Script Web App URL paste karo.
   */

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycby7aULcsaCK7fs2TDPlYyxguO4k5JtnydUUCizu9fMpYDZ-5b4o_Nx0xZ3B7SuWfg/exec";


  // ---------------------------------------------
  // STATUS MESSAGE
  // ---------------------------------------------

  function showStatus(message, success = true) {

    const box = document.getElementById("statusBox");

    box.style.display = "block";

    box.style.background =
      success ? "#e8f5e9" : "#ffebee";

    box.style.color =
      success ? "#2e7d32" : "#c62828";

    box.innerText = message;
  }


  // ---------------------------------------------
  // GET FORM DATA
  // ---------------------------------------------

  function getFormData() {

    return {

      toteId:
        document.getElementById("toteId").value.trim(),

      vendor:
        document.getElementById("vendor").value.trim(),

      pickerName:
        document.getElementById("pickerName").value.trim(),

      tlNo:
        document.getElementById("tlNo").value.trim(),

      totalQty:
        document.getElementById("totalQty").value.trim(),

      rejectQty:
        document.getElementById("rejectQty").value.trim(),

      status: "Saved"
    };
  }


  // ---------------------------------------------
  // VALIDATION
  // ---------------------------------------------

  function validateForm() {

    const data = getFormData();

    if (!data.toteId) {

      alert("⚠️ Please enter Tote ID");

      document.getElementById("toteId").focus();

      return false;
    }

    if (!data.vendor) {

      alert("⚠️ Vendor required");

      document.getElementById("vendor").focus();

      return false;
    }

    if (!data.pickerName) {

      alert("⚠️ Picker Name required");

      document.getElementById("pickerName").focus();

      return false;
    }

    if (!data.tlNo) {

      alert("⚠️ TL required");

      document.getElementById("tlNo").focus();

      return false;
    }

    if (!data.totalQty) {

      alert("⚠️ Total Qty required");

      document.getElementById("totalQty").focus();

      return false;
    }

    return true;
  }


  // ---------------------------------------------
  // VIEW DATA
  // ---------------------------------------------

  async function viewData() {

    const toteId =
      document.getElementById("toteId").value.trim();

    if (!toteId) {

      alert("⚠️ पहले Tote ID डालें");

      document.getElementById("toteId").focus();

      return;
    }

    showStatus("🔄 Google Sheet से data देख रहे हैं...");

    try {

      const response = await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "get",

          toteId: toteId

        })

      });

      const result = await response.json();

      if (result.success) {

        const data = result.data;

        document.getElementById("toteId").value =
          data.toteId || "";

        document.getElementById("vendor").value =
          data.vendor || "";

        document.getElementById("pickerName").value =
          data.pickerName || "";

        document.getElementById("tlNo").value =
          data.tlNo || "";

        document.getElementById("totalQty").value =
          data.totalQty || "";

        document.getElementById("rejectQty").value =
          data.rejectQty || 0;

        showStatus("✅ Data मिल गया");

      } else {

        showStatus(
          "ℹ️ इस Tote ID का कोई saved data नहीं मिला। नया data भर सकते हैं।",
          false
        );

      }

    } catch (error) {

      showStatus(
        "❌ Google Sheet connection नहीं हो रहा है.",
        false
      );

      console.error(error);
    }
  }


  // ---------------------------------------------
  // EDIT DATA
  // ---------------------------------------------

  function editData() {

    /*
     * अब fields पहले से editable हैं।
     *
     * इसलिए Edit Data button केवल
     * confirmation के लिए रखा गया है।
     */

    document.getElementById("toteId").focus();

    showStatus("✏️ Form editing के लिए ready है");

  }


  // ---------------------------------------------
  // SAVE DATA
  // ---------------------------------------------

  async function saveData() {

    if (!validateForm()) {

      return;
    }

    const data = getFormData();

    showStatus("💾 Data Google Sheet में save हो रहा है...");

    try {

      const response = await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "save",

          toteId: data.toteId,

          vendor: data.vendor,

          pickerName: data.pickerName,

          tlNo: data.tlNo,

          totalQty: data.totalQty,

          rejectQty: data.rejectQty,

          status: "Saved"

        })

      });

      const result = await response.json();

      if (result.success) {

        showStatus(
          "✅ Data successfully saved!"
        );

      } else {

        showStatus(
          "❌ Data save failed: " +
          result.message,
          false
        );

      }

    } catch (error) {

      showStatus(
        "❌ Google Sheet connection नहीं हो रहा है.",
        false
      );

      console.error(error);
    }
  }


  // ---------------------------------------------
  // RESET TOTE
  // ---------------------------------------------

  function resetTote() {

    const confirmReset =
      confirm(
        "⚠️ क्या आप इस Tote को Reset करना चाहते हैं?\n\n" +
        "Reset function अगले step में History में data save करके current data clear करेगा."
      );

    if (!confirmReset) {

      return;
    }

    alert(
      "ℹ️ Reset system अभी अगले step में activate किया जाएगा."
    );
  }


  // ---------------------------------------------
  // VIEW HISTORY
  // ---------------------------------------------

  function viewHistory() {

    const toteId =
      document.getElementById("toteId").value.trim();

    if (!toteId) {

      alert("⚠️ पहले Tote ID डालें");

      return;
    }

    alert(
      "📜 History function अगले step में activate किया जाएगा."
    );
  }


  // ---------------------------------------------
  // PICKING COMPLETE
  // ---------------------------------------------

  async function pickingComplete() {

    if (!validateForm()) {

      return;
    }

    const confirmComplete =
      confirm(
        "क्या Picking Complete करना है?"
      );

    if (!confirmComplete) {

      return;
    }

    const data = getFormData();

    showStatus(
      "⏳ Picking Complete save हो रहा है..."
    );

    try {

      const response = await fetch(WEB_APP_URL, {

        method: "POST",

        body: JSON.stringify({

          action: "save",

          toteId: data.toteId,

          vendor: data.vendor,

          pickerName: data.pickerName,

          tlNo: data.tlNo,

          totalQty: data.totalQty,

          rejectQty: data.rejectQty,

          status: "Picking Complete"

        })

      });

      const result = await response.json();

      if (result.success) {

        showStatus(
          "✅ PICKING COMPLETE!"
        );

        alert(
          "✅ Picking Complete हो गया.\n\nअब VRP Verify किया जा सकता है."
        );

      } else {

        showStatus(
          "❌ Picking Complete failed.",
          false
        );

      }

    } catch (error) {

      showStatus(
        "❌ Google Sheet connection नहीं हो रहा है.",
        false
      );

      console.error(error);
    }
  }


  // ---------------------------------------------
  // VRP VERIFY
  // ---------------------------------------------

  function vrpVerify() {

    const toteId =
      document.getElementById("toteId").value.trim();

    if (!toteId) {

      alert("⚠️ पहले Tote ID डालें");

      return;
    }

    alert(
      "🔵 VRP Verify system अगले step में activate किया जाएगा."
    );
  }

</script>

</body>
</html>
