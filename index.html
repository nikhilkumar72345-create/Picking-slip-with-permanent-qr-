<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Picking Form</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 15px;

      font-family: Arial, sans-serif;

      background: #f3f4f6;
    }


    .container {

      max-width: 500px;

      margin: auto;

      background: #ffffff;

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 3px 15px rgba(0,0,0,0.12);
    }


    h2 {

      text-align: center;

      margin-top: 0;

      margin-bottom: 20px;
    }


    .form-group {

      margin-bottom: 15px;
    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 6px;
    }


    input {

      width: 100%;

      padding: 13px;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      font-size: 16px;

      background: #f8fafc;
    }


    input:disabled {

      background: #e5e7eb;

      color: #374151;
    }


    .buttons {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 20px;
    }


    button {

      border: none;

      padding: 14px 8px;

      border-radius: 9px;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }


    .view-btn {

      background: #2563eb;
    }


    .edit-btn {

      background: #f59e0b;
    }


    .save-btn {

      background: #16a34a;
    }


    .reset-btn {

      background: #dc2626;
    }


    .history-btn {

      background: #7c3aed;

      grid-column: 1 / -1;
    }


    .complete-btn {

      width: 100%;

      margin-top: 15px;

      background: #059669;

      font-size: 17px;
    }


    .vrp-btn {

      width: 100%;

      margin-top: 10px;

      background: #0891b2;

      font-size: 17px;
    }


    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      text-align: center;

      font-weight: bold;

      display: none;
    }


    .status.success {

      display: block;

      background: #dcfce7;

      color: #166534;
    }


    .status.error {

      display: block;

      background: #fee2e2;

      color: #991b1b;
    }

  </style>

</head>


<body>


  <div class="container">


    <h2>📦 PICKING FORM</h2>


    <!-- Tote ID -->

    <div class="form-group">

      <label for="toteId">
        Tote ID
      </label>

      <input
        type="text"
        id="toteId"
        placeholder="Example: 428-00506"
      >

    </div>


    <!-- Vendor -->

    <div class="form-group">

      <label for="vendor">
        Vendor
      </label>

      <input
        type="text"
        id="vendor"
        placeholder="Enter Vendor"
        disabled
      >

    </div>


    <!-- Picker -->

    <div class="form-group">

      <label for="pickerName">
        Picker Name
      </label>

      <input
        type="text"
        id="pickerName"
        placeholder="Enter Picker Name"
        disabled
      >

    </div>


    <!-- TL -->

    <div class="form-group">

      <label for="tlNo">
        TL
      </label>

      <input
        type="text"
        id="tlNo"
        placeholder="Enter TL"
        disabled
      >

    </div>


    <!-- Total Qty -->

    <div class="form-group">

      <label for="totalQty">
        Total Qty
      </label>

      <input
        type="number"
        id="totalQty"
        placeholder="Enter Total Qty"
        disabled
      >

    </div>


    <!-- Reject Qty -->

    <div class="form-group">

      <label for="rejectQty">
        Reject Qty
      </label>

      <input
        type="number"
        id="rejectQty"
        placeholder="Enter Reject Qty"
        disabled
      >

    </div>


    <!-- Status Message -->

    <div
      id="statusMessage"
      class="status">
    </div>


    <!-- Buttons -->

    <div class="buttons">


      <button
        class="view-btn"
        onclick="viewData()">

        👁️ View Data

      </button>


      <button
        class="edit-btn"
        onclick="editData()">

        ✏️ Edit Data

      </button>


      <button
        class="save-btn"
        onclick="saveData()">

        💾 Save Data

      </button>


      <button
        class="reset-btn"
        onclick="resetTote()">

        🔄 Reset Tote

      </button>


      <button
        class="history-btn"
        onclick="viewHistory()">

        📜 View History

      </button>


    </div>


    <button
      class="complete-btn"
      onclick="pickingComplete()">

      ✅ PICKING COMPLETE

    </button>


    <button
      class="vrp-btn"
      onclick="vrpVerify()">

      🔐 VRP VERIFY

    </button>


  </div>



  <script>


    // ======================================
    // GOOGLE APPS SCRIPT WEB APP URL
    // ======================================

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycby7aULcsaCK7fs2TDPlYyxguO4k5JtnydUUCizu9fMpYDZ-5b4o_Nx0xZ3B7SuWfg/exec";



    // ======================================
    // STATUS MESSAGE
    // ======================================

    function showStatus(message, type) {

      const box =
        document.getElementById("statusMessage");

      box.textContent = message;

      box.className = "status " + type;

    }



    // ======================================
    // GET FORM DATA
    // ======================================

    function getFormData() {

      return {

        toteId:
          document.getElementById("toteId")
          .value
          .trim(),

        vendor:
          document.getElementById("vendor")
          .value
          .trim(),

        pickerName:
          document.getElementById("pickerName")
          .value
          .trim(),

        tlNo:
          document.getElementById("tlNo")
          .value
          .trim(),

        totalQty:
          document.getElementById("totalQty")
          .value
          .trim(),

        rejectQty:
          document.getElementById("rejectQty")
          .value
          .trim()

      };

    }



    // ======================================
    // VIEW DATA
    // ======================================

    async function viewData() {

      const toteId =
        document.getElementById("toteId")
        .value
        .trim();


      if (!toteId) {

        showStatus(
          "⚠️ पहले Tote ID डालें",
          "error"
        );

        return;
      }


      showStatus(
        "🔍 Data खोज रहा है...",
        "success"
      );


      try {

        const response = await fetch(
          WEB_APP_URL,
          {
            method: "POST",

            body: JSON.stringify({
              action: "get",
              toteId: toteId
            })
          }
        );


        const result =
          await response.json();


        if (!result.success) {

          showStatus(
            "❌ " + result.message,
            "error"
          );

          return;
        }


        const data =
          result.data;


        document.getElementById("vendor")
          .value = data.vendor || "";


        document.getElementById("pickerName")
          .value = data.pickerName || "";


        document.getElementById("tlNo")
          .value = data.tlNo || "";


        document.getElementById("totalQty")
          .value = data.totalQty || "";


        document.getElementById("rejectQty")
          .value = data.rejectQty || "";


        showStatus(
          "✅ Data successfully loaded",
          "success"
        );

      }


      catch (error) {

        showStatus(
          "❌ Google Sheet connection failed",
          "error"
        );

      }

    }



    // ======================================
    // EDIT DATA
    // ======================================

    function editData() {

      document.getElementById("vendor")
        .disabled = false;


      document.getElementById("pickerName")
        .disabled = false;


      document.getElementById("tlNo")
        .disabled = false;


      document.getElementById("totalQty")
        .disabled = false;


      document.getElementById("rejectQty")
        .disabled = false;


      showStatus(
        "✏️ Edit Mode ON",
        "success"
      );

    }



    // ======================================
    // SAVE DATA
    // ======================================

    async function saveData() {

      const data =
        getFormData();


      if (!data.toteId) {

        showStatus(
          "⚠️ Tote ID required",
          "error"
        );

        return;
      }


      if (!data.vendor) {

        showStatus(
          "⚠️ Vendor required",
          "error"
        );

        return;
      }


      if (!data.pickerName) {

        showStatus(
          "⚠️ Picker Name required",
          "error"
        );

        return;
      }


      if (!data.totalQty) {

        showStatus(
          "⚠️ Total Qty required",
          "error"
        );

        return;
      }


      showStatus(
        "💾 Saving data...",
        "success"
      );


      try {

        const response =
          await fetch(
            WEB_APP_URL,
            {
              method: "POST",

              body: JSON.stringify({

                action: "save",

                ...data,

                status: "Saved"

              })
            }
          );


        const result =
          await response.json();


        if (!result.success) {

          showStatus(
            "❌ " + result.message,
            "error"
          );

          return;
        }


        showStatus(
          "✅ " + result.message,
          "success"
        );


        disableFields();

      }


      catch (error) {

        showStatus(
          "❌ Google Sheet connection failed",
          "error"
        );

      }

    }



    // ======================================
    // DISABLE EDITABLE FIELDS
    // ======================================

    function disableFields() {

      document.getElementById("vendor")
        .disabled = true;


      document.getElementById("pickerName")
        .disabled = true;


      document.getElementById("tlNo")
        .disabled = true;


      document.getElementById("totalQty")
        .disabled = true;


      document.getElementById("rejectQty")
        .disabled = true;

    }



    // ======================================
    // RESET
    // ======================================

    function resetTote() {

      alert(
        "🔄 Reset Tote Step will be added later."
      );

    }



    // ======================================
    // HISTORY
    // ======================================

    function viewHistory() {

      alert(
        "📜 History Step will be added later."
      );

    }



    // ======================================
    // PICKING COMPLETE
    // ======================================

    function pickingComplete() {

      alert(
        "✅ Picking Complete.\n\n" +
        "Next process: VRP Verification."
      );

    }



    // ======================================
    // VRP VERIFY
    // ======================================

    function vrpVerify() {

      alert(
        "🔐 VRP Verification will be added later."
      );

    }


  </script>


</body>

</html>
